basePath: /
definitions:
  db.APIKey:
    properties:
      created:
        type: string
      key:
        type: string
      label:
        type: string
    type: object
  handlers.CreateKeyRequest:
    properties:
      label:
        type: string
    required:
    - label
    type: object
  handlers.TelemetryRequest:
    properties:
      data:
        additionalProperties: true
        type: object
      full_url:
        type: string
      host:
        type: string
      package:
        type: string
    required:
    - data
    - full_url
    - host
    - package
    type: object
  handlers.TelemetryRow:
    properties:
      fields:
        additionalProperties: true
        type: object
      full_url:
        type: string
      host:
        type: string
      ip:
        type: string
      package:
        type: string
      time:
        type: string
      user_agent:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-performance telemetry receiver with InfluxDB storage.
  title: CloakApp Telemetry Receiver API
  version: "1.0"
paths:
  /admin/api/data:
    get:
      description: Retrieve the latest telemetry data from InfluxDB
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TelemetryRow'
            type: array
      summary: Get telemetry data
      tags:
      - Admin
  /admin/api/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.APIKey'
            type: array
      summary: List API keys
      tags:
      - API Keys
    post:
      consumes:
      - application/json
      parameters:
      - description: Key Label
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate API key
      tags:
      - API Keys
  /admin/api/keys/{key}:
    delete:
      parameters:
      - description: API Key
        in: path
        name: key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete API key
      tags:
      - API Keys
  /telemetry:
    post:
      consumes:
      - application/json
      description: Receive telemetry data from frontend scripts and store in InfluxDB
      parameters:
      - description: Telemetry Data
        in: body
        name: telemetry
        required: true
        schema:
          $ref: '#/definitions/handlers.TelemetryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Receive telemetry data
      tags:
      - Telemetry
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
