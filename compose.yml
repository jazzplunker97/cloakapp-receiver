services:
  receiver:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    depends_on:
      - influxdb
    networks:
      - proxy-network

  influxdb:
    image: docker.io/library/influxdb:2.7-alpine
    ports:
      - "8086:8086"
    env_file:
      - .env
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - proxy-network

volumes:
  influxdb-data:

networks:
  proxy-network:
    external: true
